spring.application.name=customer-service
server.port=8082
# Add this line to match your browser URL path
server.servlet.context-path=/

# --- View resolution (equivalent of InternalResourceViewResolver bean in plain Spring) ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- MySQL DataSource (equivalent of the <bean id="dataSource"> in applicationContext.xml) ---
spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?useSSL=false&allowPublicKeyRetrieval=true
#spring.datasource.url=jdbc:mysql://localhost:3306/productdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver